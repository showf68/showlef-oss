<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Icones au trait : maquette v1 (design/maquettes/2026-10-19_refonte/v1.html) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l.8 12h9.4l.8-12M10.5 11v5M13.5 11v5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17M8 5v4.5M16 5v4.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.5v4M15 3.5v4M6.5 7.5h11v3a5.5 5.5 0 0 1-11 0zM12 16v4.5"/></symbol>
  </svg>

  <header class="ph">
    <img src="icons/icon_48.png" class="logo" alt="" width="30" height="30">
    <div class="ttl">
      <h1 id="appName">ShowLef</h1>
      <div class="state" id="state"><span id="stateText"></span></div>
    </div>
    <span class="sp">
      <button class="ib" id="openApp"><svg class="i"><use href="#i-list"/></svg></button>
      <button class="ib" id="gear" aria-expanded="false"><svg class="i"><use href="#i-gear"/></svg></button>
    </span>
  </header>

  <div id="mainView">
    <!-- programme absent : ce qui se passe et que faire -->
    <section class="missing" id="missing" hidden>
      <span class="mi"><svg class="i"><use href="#i-plug"/></svg></span>
      <h3 id="missTitle" data-t="appMissingTitle"></h3>
      <p id="missHelp" data-t="appMissingHelp"></p>
      <p class="do" id="missDo" data-t="appMissingDo"></p>
      <button class="big getapp" id="getApp"><svg class="i"><use href="#i-dl"/></svg><span id="getAppTx" data-t="getApp"></span></button>
      <p class="got" id="gotApp" hidden data-t="gotApp"></p>
      <button class="soft" id="recheck"><svg class="i"><use href="#i-retry"/></svg><span data-t="recheck"></span></button>
    </section>

    <!-- carte « trouve dans la page » -->
    <section class="found" id="found">
      <div class="site">
        <img class="fv" id="siteFav" alt="" width="16" height="16" hidden>
        <span class="fv none" id="siteFavNone"></span>
        <span><span id="siteLbl"></span> · <b id="siteHost"></b></span>
      </div>
      <div class="loading" id="loading">
        <i class="sk w80"></i><i class="sk w55"></i><i class="sk seg"></i><i class="sk big"></i>
      </div>
      <div id="mediaBox" hidden>
        <h3 id="mTitle"></h3>
        <div class="pick" id="pickBox" hidden>
          <div class="pick-h"><span id="mediaCount"></span><button class="lnk" id="pickToggle"></button></div>
          <div class="pick-l" id="mediaList"></div>
          <button class="soft sm allbtn" id="dlAll"><svg class="i"><use href="#i-dl"/></svg><span id="dlAllTxt"></span></button>
        </div>
        <div class="seg" id="seg">
          <button id="segVideo"><svg class="i"><use href="#i-film"/></svg><span data-t="segVideo"></span></button>
          <button id="segAudio"><svg class="i"><use href="#i-note"/></svg><span data-t="segAudio"></span></button>
        </div>
        <div class="qs" id="qs"></div>
        <button class="big" id="dlBig"><svg class="i"><use href="#i-dl"/></svg><span data-t="download"></span></button>
      </div>
      <div class="empty" id="emptyBox" hidden>
        <span class="ei"><svg class="i"><use href="#i-film"/></svg></span>
        <b data-t="noMediaTitle"></b>
        <span data-t="noMediaHelp"></span>
      </div>
      <!-- « Je ne vois pas ma video ? » (idee prise chez Video DownloadHelper) -->
      <button class="lnk helplnk" id="helpLnk" data-t="helpLink"></button>
      <div class="help" id="helpBox" hidden>
        <ol><li data-t="help1"></li><li data-t="help2"></li><li data-t="help3"></li></ol>
        <button class="soft sm" id="rescan"><svg class="i"><use href="#i-retry"/></svg><span data-t="rescan"></span></button>
      </div>
      <button class="bypage" id="pageVideo"><svg class="i"><use href="#i-globe"/></svg><span data-t="byPage"></span></button>
      <button class="bypage" id="plBtn" hidden><svg class="i"><use href="#i-list"/></svg><span data-t="plBtn"></span></button>
    </section>

    <section id="dlSection" hidden>
      <div class="ps"><span><span data-t="recent"></span><span id="dlCount" hidden></span></span><button class="lnk" id="allApp" data-t="allInApp"></button></div>
      <div id="dlList" class="dl-list"></div>
    </section>
  </div>

  <!-- reglages : meme langage visuel ; tous les reglages d'avant -->
  <section id="settings" hidden>
    <div class="set-h"><button class="ib" id="setBack"><svg class="i flip"><use href="#i-back"/></svg></button><h2 data-t="settings"></h2></div>

    <div class="grp" id="siteCard">
      <div class="grp-h"><span data-t="site"></span> · <b id="siteHost2"></b></div>
      <label class="row"><span data-t="siteButtons"></span><input type="checkbox" class="sw" id="siteButtons"></label>
      <label class="row"><span data-t="siteAudio"></span><input type="checkbox" class="sw" id="siteAudio"></label>
      <label class="row"><span data-t="siteChrome"></span><input type="checkbox" class="sw" id="siteChrome"></label>
      <div class="row fold" id="siteFolderRow">
        <span data-t="siteFolder"></span>
        <span class="fold-r">
          <span class="fold-path" id="siteFolderPath"></span>
          <button class="soft sm" id="siteFolderPick" data-t="choose"></button>
          <button class="ib sm" id="siteFolderClear" hidden><svg class="i"><use href="#i-x"/></svg></button>
        </span>
      </div>
    </div>

    <div class="grp">
      <div class="grp-h" data-t="general"></div>
      <label class="row"><span data-t="lang"></span><select id="sLang"></select></label>
      <label class="row"><span data-t="theme"></span><select id="sTheme"></select></label>
      <label class="row"><span data-t="overlay"></span><input type="checkbox" class="sw" id="sOverlay"></label>
      <label class="row"><span data-t="overlayPos"></span><select id="sPos"></select></label>
      <label class="row"><span data-t="quality"></span><select id="sQuality"></select></label>
      <label class="row"><span data-t="advanced"></span><input type="checkbox" class="sw" id="sAdvanced"></label>
      <label class="row"><span data-t="audioFormat"></span><select id="sAudio"><option value="mp3">MP3</option><option value="m4a">M4A</option></select></label>
      <label class="row"><span data-t="ask"></span><input type="checkbox" class="sw" id="sAsk"></label>
      <label class="row"><span data-t="intercept"></span><input type="checkbox" class="sw" id="sIntercept"></label>
      <label class="row"><span data-t="minSize"></span><input type="number" id="sMin" min="0" max="100000" step="50"></label>
      <label class="row"><span data-t="compat"></span><input type="checkbox" class="sw" id="sCompat"></label>
      <div class="row"><span data-t="shortcut"></span><span class="kbd-row"><kbd id="kbd"></kbd><button class="lnk" id="kbdChange" data-t="shortcutChange"></button></span></div>
    </div>
    <div class="set-f"><button class="soft sm" id="diag"><svg class="i"><use href="#i-copy"/></svg><span data-t="diag"></span></button></div>
  </section>

  <footer class="pf"><span id="tagline"><span data-t="appName"></span> <span class="num" id="ver"></span></span><button class="lnk" id="siteAudioFoot"><svg class="i"><use href="#i-check"/></svg><span data-t="siteAudioFoot"></span></button></footer>

  <div class="notice" id="notice" hidden></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
